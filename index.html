<!DOCTYPE html>
<html lang="bn" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asifio App Store</title>
    
    <link rel="icon" type="image/png" href="icon/fevicon.png">
    <link rel="apple-touch-icon" href="icon/fevicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- বেসিক সেটআপ --- */
        body {
            font-family: 'Hind Siliguri', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- আইকন এনিমেশন ফিক্স --- */
        .icon-box svg {
            opacity: 0; /* শুরুতে লুকানো থাকবে */
            transition: opacity 0.3s ease;
        }

        .icon-box.animating svg {
            opacity: 1; /* ক্লিক করার পর দেখা যাবে */
        }

        #modal-icon {
            border-radius: 1.25rem; /* শুরুতে স্কয়ার */
            transition: border-radius 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            object-fit: cover;
        }

        /* --- স্লাইডার এনিমেশন --- */
        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1s ease-in-out, transform 1.2s ease;
            transform: scale(1.05);
        }
        .slide.active {
            opacity: 1;
            transform: scale(1);
        }

        /* --- অন্যান্য --- */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        #progress-bar { transition: stroke-dashoffset 100ms linear; }
        .snake { transition: d 0.2s linear; }
    </style>

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-50 dark:bg-slate-900 transition-colors duration-300">

    <div id="drawer-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity"></div>

    <div id="nav-drawer" class="fixed top-0 left-0 h-full w-64 bg-white dark:bg-slate-800 z-50 transform -translate-x-full transition-transform duration-300 shadow-xl border-r dark:border-slate-700">
        <div class="p-5 border-b dark:border-slate-700 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img src="icon/logo.png" alt="Logo" class="w-6 h-6 object-contain">
                <span class="text-xl font-bold text-emerald-600 dark:text-emerald-400">App Store</span>
            </div>
            <button id="close-drawer" class="text-gray-500 text-3xl">&times;</button>
        </div>
        <ul class="p-4 space-y-2"></ul>
    </div>

    <nav class="sticky top-0 z-30 bg-white dark:bg-slate-800 shadow-sm border-b dark:border-slate-700">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <button id="open-drawer" class="p-2 rounded-lg text-emerald-600 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-slate-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="text-xl font-bold text-emerald-600 dark:text-emerald-400">App Store</div>
            </div>
            
            <div class="flex items-center space-x-4">
                <button id="theme-toggle" class="p-2 rounded-full text-gray-600 dark:text-yellow-400">
                    <svg id="sun-icon" class="hidden w-6 h-6 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2"><path d="M12 18.5C15.5899 18.5 18.5 15.5899 18.5 12C18.5 8.41015 15.5899 5.5 12 5.5C8.41015 5.5 5.5 8.41015 5.5 12C5.5 15.5899 8.41015 18.5 12 18.5Z"></path><path d="M19.14 19.14L19.01 19.01M19.01 4.99L19.14 4.86L19.01 4.99ZM4.86 19.14L4.99 19.01L4.86 19.14ZM12 2.08V2V2.08ZM12 22V21.92V22ZM2.08 12H2H2.08ZM22 12H21.92H22ZM4.99 4.99L4.86 4.86L4.99 4.99Z"></path></svg>
                    <svg id="moon-icon" class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M2.03009 12.42C2.39009 17.57 6.76009 21.76 11.9901 21.99C15.6801 22.15 18.9801 20.43 20.9601 17.72C21.7801 16.61 21.3401 15.87 19.9701 16.12C19.3001 16.12 18.6101 16.29 17.8901 16.26C13.0001 16.06 9.00009 11.97 8.98009 7.13996C8.97009 5.83996 9.24009 4.60996 9.73009 3.48996C10.2701 2.24996 9.62009 1.65996 8.37009 2.18996C4.41009 3.85996 1.70009 7.84996 2.03009 12.42Z"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-8 px-4">
        <div class="slider-container mb-8 shadow-lg relative w-full aspect-[327/121] overflow-hidden rounded-2xl bg-gray-200 dark:bg-slate-800">
            <div id="slider-wrapper" class="h-full relative"></div>
            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex space-x-2 z-10" id="slider-dots"></div>
        </div>

        <h2 class="text-xl font-bold mb-6 dark:text-white border-l-4 border-emerald-500 pl-3">সেরা ইসলামিক অ্যাপস</h2>
        <div id="app-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>
    </main>

    <div id="app-modal" class="fixed inset-0 z-[60] hidden overflow-y-auto">
        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm" id="modal-overlay"></div>
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="relative bg-white dark:bg-slate-800 w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden">
                <div class="h-32 bg-emerald-600 dark:bg-emerald-700 flex items-center justify-end p-6">
                    <button id="close-modal" class="bg-white/20 text-white p-2 rounded-full">&times;</button>
                </div>
                <div class="px-8 pb-8 -mt-12">
                    <div class="flex items-end space-x-6 mb-6">
                        <div class="icon-box relative flex-shrink-0">
                            <img id="modal-icon" src="" class="w-24 h-24 border-4 border-white dark:border-slate-800 shadow-lg bg-white relative z-10">
                            <svg class="absolute -top-1 -left-1 w-[104px] h-[104px] rotate-[-90deg] pointer-events-none z-20" viewBox="0 0 100 100">
                                <circle class="track fill-none stroke-gray-100 dark:stroke-slate-700 stroke-[3.5]" cx="50" cy="50" r="47"></circle>
                                <path class="snake fill-none stroke-emerald-500 stroke-[3.5] stroke-linecap-round" d=""></path>
                            </svg>
                        </div>
                        <div class="flex-1">
                            <h2 id="modal-title" class="text-2xl font-bold dark:text-white"></h2>
                            <div class="relative h-6">
                                <p id="modal-category" class="absolute inset-0 text-emerald-600 font-medium"></p>
                                <p id="progress-text" class="absolute inset-0 text-emerald-600 font-bold hidden"></p>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between items-center py-4 border-y dark:border-slate-700 mb-6 text-center">
                        <div><p id="modal-rating" class="font-bold dark:text-white"></p><p class="text-[10px] text-gray-500 uppercase">Rating</p></div>
                        <div><p id="modal-downloads" class="font-bold dark:text-white"></p><p class="text-[10px] text-gray-500 uppercase">Downloads</p></div>
                        <div><p id="modal-size" class="font-bold dark:text-white"></p><p class="text-[10px] text-gray-500 uppercase">Size</p></div>
                    </div>
                    <p id="modal-desc" class="text-gray-600 dark:text-gray-300 text-sm mb-6"></p>
                    <button id="download-link" class="block w-full bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg">ইন্সটল করুন</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- অ্যাপ ডেটা ---
        const apps = [
            { id: 1, name: "Muslim Pro", icon: "icon/Audio.png", rating: 4.8, category: "নামাজ ও সময়", size: "৩০ এমবি", downloads: "৫০এম+", description: "নামাজের সঠিক সময় এবং কিবলার দিক নির্ণয়।" },
            { id: 2, name: "Al Quran", icon: "icon/Quran.png", rating: 4.9, category: "কুরআন", size: "২০ এমবি", downloads: "১০এম+", description: "বাংলা অর্থসহ কুরআন পড়ার অ্যাপ।" }
        ];

        // --- মেইন লজিক ---
        function displayApps() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = apps.map((app, index) => `
                <div onclick="openAppDetails(${index})" class="p-3 bg-white dark:bg-slate-800 rounded-2xl shadow-sm cursor-pointer hover:shadow-md transition-all">
                    <img src="${app.icon}" class="w-full aspect-square rounded-2xl mb-3 object-cover">
                    <h3 class="font-semibold text-sm dark:text-white truncate">${app.name}</h3>
                    <p class="text-[10px] text-gray-500">${app.category}</p>
                </div>
            `).join('');
        }

        function openAppDetails(index) {
            const app = apps[index];
            document.getElementById('modal-title').innerText = app.name;
            document.getElementById('modal-icon').src = app.icon;
            document.getElementById('modal-rating').innerText = app.rating + " ★";
            document.getElementById('modal-size').innerText = app.size;
            document.getElementById('modal-downloads').innerText = app.downloads;
            document.getElementById('modal-desc').innerText = app.description;

            const modal = document.getElementById('app-modal');
            const modalIcon = document.getElementById('modal-icon');
            const iconBox = document.querySelector('.icon-box');
            const snakePath = document.querySelector('.snake');
            const installBtn = document.getElementById('download-link');
            const catEl = document.getElementById('modal-category');
            const progText = document.getElementById('progress-text');

            // রিসেট
            modalIcon.style.borderRadius = "1.25rem";
            iconBox.classList.remove('animating');
            if(snakePath) snakePath.setAttribute("d", "");
            installBtn.disabled = false;
            installBtn.innerText = "ইন্সটল করুন";
            catEl.innerText = app.category;
            catEl.classList.remove('hidden');
            progText.classList.add('hidden');

            installBtn.onclick = () => {
                installBtn.disabled = true;
                installBtn.innerText = "অপেক্ষা করুন...";
                
                // এনিমেশন শুরু: আইকন গোল হবে এবং SVG দেখা যাবে
                modalIcon.style.borderRadius = "50%";
                iconBox.classList.add('animating');
                
                catEl.classList.add('hidden');
                progText.classList.remove('hidden');

                let prog = 0, off = 0;
                function animate() {
                    if (prog < 100) {
                        prog += 0.3; // স্লো স্পিড
                        off++;
                        
                        let d = "", angle = (prog / 100) * 360;
                        for (let a = 0; a <= angle; a += 2) {
                            let s = Math.sin((a * 0.4) - (off * 0.2)) * 2.2;
                            let rad = (a * Math.PI) / 180;
                            let x = 50 + (47 + s) * Math.cos(rad);
                            let y = 50 + (47 + s) * Math.sin(rad);
                            d += (a === 0 ? "M" : "L") + x + "," + y;
                        }
                        snakePath.setAttribute("d", d);
                        progText.innerText = Math.floor(prog) + "% ডাউনলোড হচ্ছে";
                        requestAnimationFrame(animate);
                    } else {
                        progText.innerText = "১০০% সম্পন্ন";
                        setTimeout(() => modal.classList.add('hidden'), 500);
                    }
                }
                animate();
            };

            modal.classList.remove('hidden');
        }

        // ক্লোজ মোডাল
        document.getElementById('close-modal').onclick = () => document.getElementById('app-modal').classList.add('hidden');

        // ড্রয়ার লজিক
        document.getElementById('open-drawer').onclick = () => {
            document.getElementById('nav-drawer').classList.remove('-translate-x-full');
            document.getElementById('drawer-overlay').classList.remove('hidden');
        };
        document.getElementById('close-drawer').onclick = () => {
            document.getElementById('nav-drawer').classList.add('-translate-x-full');
            document.getElementById('drawer-overlay').classList.add('hidden');
        };

        // থিম টগল
        document.getElementById('theme-toggle').onclick = () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('sun-icon').classList.toggle('hidden', !isDark);
            document.getElementById('moon-icon').classList.toggle('hidden', isDark);
        };

        window.onload = displayApps;
    </script>
</body>
</html>
